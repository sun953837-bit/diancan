version: "3.9"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api-php:
    image: php:8.2-fpm
    working_dir: /var/www/html
    volumes:
      - ../../services/api-php:/var/www/html
    environment:
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      JWT_SECRET: ${JWT_SECRET}
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      WECHAT_APP_ID: ${WECHAT_APP_ID}
      WECHAT_MCH_ID: ${WECHAT_MCH_ID}
      WECHAT_MCH_CERT_SERIAL: ${WECHAT_MCH_CERT_SERIAL}
      WECHAT_PRIVATE_KEY_PATH: ${WECHAT_PRIVATE_KEY_PATH}
      WECHAT_API_V3_KEY: ${WECHAT_API_V3_KEY}
      WECHAT_NOTIFY_URL: ${WECHAT_NOTIFY_URL}
      WECHAT_PAY_MODE: ${WECHAT_PAY_MODE}
      ADMIN_DEFAULT_ACCOUNT: ${ADMIN_DEFAULT_ACCOUNT}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
    depends_on:
      - mysql
      - redis

  nginx:
    image: nginx:1.25
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../services/api-php:/var/www/html
    depends_on:
      - api-php

  worker-py:
    image: python:3.11
    working_dir: /app
    volumes:
      - ../../services/worker-py:/app
    command: ["bash", "-c", "pip install -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8001"]
    ports:
      - "8001:8001"
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  admin-web:
    image: node:20
    working_dir: /app
    volumes:
      - ../../apps/admin-web:/app
    command: ["bash", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    ports:
      - "5173:5173"
    depends_on:
      - api-php

volumes:
  mysql_data:
